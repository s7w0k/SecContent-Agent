version: '1.0'
name: branch-pipeline
displayName: BranchPipeline
triggers:
  trigger: auto
  push:
    branches:
      include:
        - feat/*
        - fix/*
        - chore/*
        - test/*
      exclude:
        - main
        - master
variables:
  MONGO_ROOT_PASSWORD: pr_agent_2024
stages:
  # ═══════════════════════════════════════════════════════════
  # Lint + Test
  # ═══════════════════════════════════════════════════════════
  - name: check
    displayName: 代码检查与测试
    strategy: naturally
    trigger: auto
    steps:
      - step: build@python
        name: lint_python
        displayName: Python Lint (ruff)
        pythonVersion: '3.12'
        commands:
          - export PATH="$HOME/.local/bin:$PATH"
          - python3 -m pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
          - python3 -m pip install --upgrade pip -q
          - python3 -m pip install ruff -q
          - python3 -m ruff check services/ tests/
          - python3 -m ruff format --check services/ tests/
      - step: build@python
        name: test_python
        displayName: Python Test (pytest)
        pythonVersion: '3.12'
        commands:
          - export PATH="$HOME/.local/bin:$PATH"
          - python3 -m pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
          - python3 -m pip install --upgrade pip -q
          - python3 -m pip install -r services/mcp_crawl/requirements.txt -q
          - python3 -m pip install -r services/mcp_wewe/requirements.txt -q
          - python3 -m pip install -r services/backend/requirements.txt -q
          - python3 -m pip install pytest pytest-asyncio pytest-cov pytest-mock pytest-timeout httpx mongomock -q
          - python3 -m pytest tests/ --cov=services --cov-report=term-missing -v --tb=short --timeout=60
