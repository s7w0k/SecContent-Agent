version: '1.0'
name: pr-pipeline
displayName: PRPipeline
triggers:
  trigger: auto
  pr:
    branches:
      include:
        - main
        - master
variables:
  MONGO_ROOT_PASSWORD: pr_agent_2024
stages:
  # ═══════════════════════════════════════════════════════════
  # 阶段一：Lint
  # ═══════════════════════════════════════════════════════════
  - name: lint
    displayName: 代码检查
    strategy: naturally
    trigger: auto
    steps:
      - step: build@python
        name: lint_python
        displayName: Python Lint (ruff)
        pythonVersion: '3.12'
        commands:
          - python3 -m pip install --upgrade pip -q
          - python3 -m pip install ruff -q
          - ruff check services/ tests/
          - ruff format --check services/ tests/

  # ═══════════════════════════════════════════════════════════
  # 阶段二：Test
  # ═══════════════════════════════════════════════════════════
  - name: test
    displayName: 测试
    strategy: naturally
    trigger: auto
    dependsOn:
      - lint
    steps:
      - step: build@python
        name: test_python
        displayName: Python Test (pytest)
        pythonVersion: '3.12'
        commands:
          - python3 -m pip install --upgrade pip -q
          - python3 -m pip install -r services/mcp_crawl/requirements.txt -q
          - python3 -m pip install -r services/mcp_wewe/requirements.txt -q
          - python3 -m pip install -r services/backend/requirements.txt -q
          - python3 -m pip install pytest pytest-asyncio pytest-cov pytest-mock pytest-timeout httpx mongomock -q
          - pytest tests/ --cov=services --cov-report=term-missing --cov-report=xml -v --tb=short --timeout=60
          # 覆盖率门禁
          - |
            python3 -c "
            import xml.etree.ElementTree as ET
            tree = ET.parse('coverage.xml')
            root = tree.getroot()
            line_rate = float(root.attrib.get('line-rate', 0)) * 100
            threshold = 70
            print(f'Line coverage: {line_rate:.1f}% (threshold: {threshold}%)')
            if line_rate < threshold:
                print(f'ERROR: Coverage below threshold')
                exit(1)
            "
