# ═══════════════════════════════════════════════════════════════
# PR Agent Demo - Docker Compose 编排
# 用法:
#   启动:  docker compose up -d
#   停止:  docker compose down -v
#   构建:  docker compose build
#   日志:  docker compose logs -f
# ═══════════════════════════════════════════════════════════════

x-common-security: &common-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp

services:
  # ──────────────────────────────────────────────────────────
  # MongoDB 7 - 数据持久化
  # ──────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    restart: unless-stopped
    # MongoDB 需要更多权限，不使用 common-security
    security_opt:
      - no-new-privileges:true
    read_only: false
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-pr_agent_2024}
      MONGO_INITDB_DATABASE: pr_agent
    volumes:
      - mongo_data:/data/db
      - ./mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
    # 仅绑定宿主机回环地址，供 MongoDB Compass 安全访问
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    networks:
      - agent-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")' --quiet || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────────────────────
  # Redis 7 - ARQ 持久任务队列
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >-
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
      exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD";
      else exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction; fi'
    volumes:
      - redis_data:/data
    networks:
      - agent-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ──────────────────────────────────────────────────────────
  # MCP-WeWe - 微信公众号 RSS MCP HTTP 桥接
  # ──────────────────────────────────────────────────────────
  mcp-wewe:
    build:
      context: ./services/mcp_wewe
      dockerfile: Dockerfile
    restart: unless-stopped
    <<: *common-security
    env_file:
      - .env
    environment:
      WEWE_RSS_URL: ${WEWE_RSS_URL:-}
      WEWE_AUTH_CODE: ${WEWE_AUTH_CODE:-}
    networks:
      - agent-net
    # 不暴露端口到宿主机（仅内部网络可达）
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import httpx; httpx.get('http://localhost:8100/health').raise_for_status()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ──────────────────────────────────────────────────────────
  # MCP-Crawl - 海外安全新闻爬虫 MCP HTTP 桥接
  # ──────────────────────────────────────────────────────────
  mcp-crawl:
    build:
      context: ./services/mcp_crawl
      dockerfile: Dockerfile
    restart: unless-stopped
    <<: *common-security
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - .env
    environment:
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MCP_CRAWL_API_KEY: ${MCP_CRAWL_API_KEY:-}
      MCP_CRAWL_MAX_CONCURRENCY: ${MCP_CRAWL_MAX_CONCURRENCY:-2}
      MCP_CRAWL_MAX_ARTICLES: ${MCP_CRAWL_MAX_ARTICLES:-500}
      MCP_CRAWL_MAX_BATCH_URLS: ${MCP_CRAWL_MAX_BATCH_URLS:-100}
      MCP_CRAWL_MAX_REQUEST_MB: ${MCP_CRAWL_MAX_REQUEST_MB:-5}
      MCP_CRAWL_MAX_RESPONSE_MB: ${MCP_CRAWL_MAX_RESPONSE_MB:-20}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      RSSHUB_URL: http://rsshub:1200
    networks:
      - agent-net
    # 不暴露端口到宿主机（仅内部网络可达）
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import httpx; httpx.get('http://localhost:8101/health').raise_for_status()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ──────────────────────────────────────────────────────────
  # Backend - 核心后端服务（API 网关 + Agent 流水线）
  # ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    restart: unless-stopped
    <<: *common-security
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://admin:${MONGO_ROOT_PASSWORD:-pr_agent_2024}@mongodb:27017
      MONGODB_DB: pr_agent
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "1"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ARQ_MAX_JOBS: ${ARQ_MAX_JOBS:-3}
      ARQ_JOB_TIMEOUT: ${ARQ_JOB_TIMEOUT:-600}
      ARQ_MAX_RETRIES: ${ARQ_MAX_RETRIES:-3}
      MCP_WEWE_URL: http://mcp-wewe:8100
      MCP_CRAWL_URL: ${MCP_CRAWL_URL:-http://mcp-crawl:8101}
      MCP_CRAWL_API_KEY: ${MCP_CRAWL_API_KEY:-}
      MCP_CRAWL_CONNECT_TIMEOUT: ${MCP_CRAWL_CONNECT_TIMEOUT:-5}
      MCP_CRAWL_READ_TIMEOUT: ${MCP_CRAWL_READ_TIMEOUT:-300}
      MCP_CRAWL_MAX_RETRIES: ${MCP_CRAWL_MAX_RETRIES:-2}
      MCP_CRAWL_MAX_RESPONSE_MB: ${MCP_CRAWL_MAX_RESPONSE_MB:-20}
      MCP_CRAWL_VERIFY_TLS: ${MCP_CRAWL_VERIFY_TLS:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      EXECUTION_LOG_LEVEL: ${EXECUTION_LOG_LEVEL:-INFO}
      EXECUTION_LOG_RUN_RETENTION_DAYS: ${EXECUTION_LOG_RUN_RETENTION_DAYS:-90}
      EXECUTION_LOG_EVENT_RETENTION_DAYS: ${EXECUTION_LOG_EVENT_RETENTION_DAYS:-30}
      EXECUTION_LOG_ERROR_RETENTION_DAYS: ${EXECUTION_LOG_ERROR_RETENTION_DAYS:-90}
      EXECUTION_LOG_DEBUG_RETENTION_DAYS: ${EXECUTION_LOG_DEBUG_RETENTION_DAYS:-7}
      EXECUTION_LOG_QUEUE_SIZE: ${EXECUTION_LOG_QUEUE_SIZE:-10000}
      EXECUTION_LOG_BATCH_SIZE: ${EXECUTION_LOG_BATCH_SIZE:-50}
      EXECUTION_LOG_FLUSH_INTERVAL_MS: ${EXECUTION_LOG_FLUSH_INTERVAL_MS:-500}
      KNOWLEDGE_BASE_DIR: /app/documents
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_APP_RETENTION_DAYS: ${LOG_APP_RETENTION_DAYS:-30}
      LOG_ERROR_RETENTION_DAYS: ${LOG_ERROR_RETENTION_DAYS:-90}
      LOG_ACCESS_RETENTION_DAYS: ${LOG_ACCESS_RETENTION_DAYS:-7}
      LOG_AUDIT_RETENTION_DAYS: ${LOG_AUDIT_RETENTION_DAYS:-365}
    volumes:
      - ./agent-security-briefs:/app/documents:rw
      - ./docs:/app/docs:ro
      - ./logs:/app/logs
    networks:
      - agent-net
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-wewe:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import httpx; httpx.get('http://localhost:8000/api/health').raise_for_status()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ──────────────────────────────────────────────────────────
  # Backend Worker - ARQ 独立流水线执行进程
  # ──────────────────────────────────────────────────────────
  backend-worker:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    restart: unless-stopped
    <<: *common-security
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://admin:${MONGO_ROOT_PASSWORD:-pr_agent_2024}@mongodb:27017
      MONGODB_DB: pr_agent
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "1"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ARQ_MAX_JOBS: ${ARQ_MAX_JOBS:-3}
      ARQ_JOB_TIMEOUT: ${ARQ_JOB_TIMEOUT:-600}
      ARQ_MAX_RETRIES: ${ARQ_MAX_RETRIES:-3}
      MCP_WEWE_URL: http://mcp-wewe:8100
      MCP_CRAWL_URL: ${MCP_CRAWL_URL:-http://mcp-crawl:8101}
      MCP_CRAWL_API_KEY: ${MCP_CRAWL_API_KEY:-}
      MCP_CRAWL_CONNECT_TIMEOUT: ${MCP_CRAWL_CONNECT_TIMEOUT:-5}
      MCP_CRAWL_READ_TIMEOUT: ${MCP_CRAWL_READ_TIMEOUT:-300}
      MCP_CRAWL_MAX_RETRIES: ${MCP_CRAWL_MAX_RETRIES:-2}
      MCP_CRAWL_MAX_RESPONSE_MB: ${MCP_CRAWL_MAX_RESPONSE_MB:-20}
      MCP_CRAWL_VERIFY_TLS: ${MCP_CRAWL_VERIFY_TLS:-true}
      KNOWLEDGE_BASE_DIR: /app/documents
      LOG_DIR: /app/logs/worker
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_APP_RETENTION_DAYS: ${LOG_APP_RETENTION_DAYS:-30}
      LOG_ERROR_RETENTION_DAYS: ${LOG_ERROR_RETENTION_DAYS:-90}
      LOG_ACCESS_RETENTION_DAYS: ${LOG_ACCESS_RETENTION_DAYS:-7}
      LOG_AUDIT_RETENTION_DAYS: ${LOG_AUDIT_RETENTION_DAYS:-365}
    volumes:
      - ./agent-security-briefs:/app/documents:ro
      - ./docs:/app/docs:ro
      - ./logs:/app/logs
    networks:
      - agent-net
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-wewe:
        condition: service_started
    command: ["python", "-m", "worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "arq", "worker.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# ═══════════════════════════════════════════════════════════════
# 持久卷
# ═══════════════════════════════════════════════════════════════
volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

# ═══════════════════════════════════════════════════════════════
# 内部网络（仅 backend 暴露端口到宿主机）
# ═══════════════════════════════════════════════════════════════
networks:
  agent-net:
    driver: bridge
