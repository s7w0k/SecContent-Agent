services:
  mcp-crawl:
    image: "${MCP_CRAWL_IMAGE:-pr-agent-mcp-crawl}:${MCP_CRAWL_IMAGE_TAG:-latest}"
    restart: unless-stopped
    init: true
    env_file:
      - path: .env.crawler
        required: false
    environment:
      MCP_CRAWL_API_KEY: "${MCP_CRAWL_API_KEY:?MCP_CRAWL_API_KEY must be set}"
      MCP_CRAWL_MAX_CONCURRENCY: "${MCP_CRAWL_MAX_CONCURRENCY:-2}"
      MCP_CRAWL_MAX_ARTICLES: "${MCP_CRAWL_MAX_ARTICLES:-500}"
      MCP_CRAWL_MAX_BATCH_URLS: "${MCP_CRAWL_MAX_BATCH_URLS:-100}"
      MCP_CRAWL_MAX_REQUEST_MB: "${MCP_CRAWL_MAX_REQUEST_MB:-5}"
      MCP_CRAWL_MAX_RESPONSE_MB: "${MCP_CRAWL_MAX_RESPONSE_MB:-20}"
      MCP_CRAWL_CORS_ORIGINS: "${MCP_CRAWL_CORS_ORIGINS:-}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1}"
      http_proxy: "${HTTP_PROXY:-}"
      https_proxy: "${HTTPS_PROXY:-}"
      no_proxy: "${NO_PROXY:-localhost,127.0.0.1}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    ports:
      - "${MCP_CRAWL_BIND_HOST:-127.0.0.1}:${MCP_CRAWL_PORT:-8101}:8101"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    pids_limit: "${MCP_CRAWL_PIDS_LIMIT:-256}"
    mem_limit: "${MCP_CRAWL_MEMORY_LIMIT:-1g}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import httpx; httpx.get('http://localhost:8101/health', timeout=3).raise_for_status()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "${MCP_CRAWL_LOG_MAX_SIZE:-20m}"
        max-file: "${MCP_CRAWL_LOG_MAX_FILES:-5}"
    networks:
      - crawler-net

networks:
  crawler-net:
    driver: bridge
