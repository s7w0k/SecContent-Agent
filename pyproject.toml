[project]
name = "pr-agent-demo"
version = "0.1.0"
description = "智能体安全PR情报Agent系统 Demo"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "s7w0k" }
]
keywords = ["agent", "security", "pr", "intelligence", "mcp"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "mongomock>=4.2",
    "httpx>=0.27",
    "bandit>=1.7",
    "ruff>=0.5",
]

# ═══════════════════════════════════════════════
# Ruff — Python Linter & Formatter
# ═══════════════════════════════════════════════
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "node_modules",
    "dist",
    "build",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # line-too-long (handled by formatter)
    "B008",   # do-not-perform-function-calls-in-argument-defaults
    "RUF001", # ambiguous fullwidth chars in Chinese docstrings
    "RUF002", # ambiguous fullwidth chars in Chinese docstrings
    "RUF003", # ambiguous fullwidth chars in Chinese comments
]

[tool.ruff.lint.per-file-ignores]
# Pre-existing issues in files not modified for task 4.1
"services/backend/api/accounts.py" = ["B904"]
"services/backend/api/dashboard.py" = ["B904"]
"services/backend/api/logs.py" = ["RUF006"]
"services/backend/api/overseas_crawl.py" = ["B904", "E701", "E702"]
"services/backend/api/reports.py" = ["B904"]
"services/backend/agent/pipeline.py" = ["N806"]
"services/backend/agent/knowledge.py" = ["B005"]
"services/backend/main.py" = ["E402"]
"services/mcp_crawl/crawler.py" = ["RUF012", "B904"]
"services/mcp_crawl/server.py" = ["N817", "SIM115"]
"services/mcp_crawl/http_bridge.py" = ["B005", "SIM115"]
"services/mcp_wewe/http_mcp_bridge.py" = ["SIM115"]
"services/mcp_wewe/wewe_mcp_server.py" = ["SIM115"]
"services/mcp_wewe/test_mcp_agent.py" = ["SIM115"]
"services/mcp_wewe/test_remote_agent.py" = ["SIM115"]
"services/mcp_wewe/wewe_tools/trpc_client.py" = ["B904"]
"tests/unit/test_draft_chat.py" = ["RUF012"]
"tests/unit/test_api_chat.py" = ["RUF012"]
"tests/unit/test_api.py" = ["RUF012"]
"tests/unit/test_mcp_crawl.py" = ["B005"]
"tests/unit/test_agent_pipeline.py" = ["N801"]
"tests/agent_evals/context_stage2/evaluator.py" = ["T201"]  # CLI 评测报告输出
"tests/agent_evals/chat_stage1/evaluator.py" = ["T201"]  # CLI 评测报告输出
"scripts/generate_baseline_manifest.py" = ["T201"]  # CLI 脚本输出
"scripts/collect_legacy_baseline.py" = ["T201"]  # CLI 脚本输出
"scripts/run_eval_harness.py" = ["T201"]  # CLI 评测报告输出
"scripts/run_replay.py" = ["T201"]  # CLI 重放报告输出
"scripts/run_fault_drill.py" = ["T201"]  # CLI 故障演练输出
"scripts/run_capacity_model.py" = ["T201"]  # CLI 容量报告输出
"scripts/migrate_user_knowledge_metadata.py" = ["T201"]  # CLI 迁移脚本输出
"scripts/probe_chat_tool_calling.py" = ["T201"]  # CLI 探测脚本输出
"scripts/set_admin.py" = ["T201"]  # CLI 管理脚本输出
"scripts/smoke_test_4_1.py" = ["T201"]  # CLI 冒烟脚本输出
"scripts/validate_agent_skills.py" = ["T201", "N806"]  # CLI 脚本输出；WHITE/GRAY/BLACK 为 ANSI 颜色常量
"scripts/check_wiki_default.py" = ["T201"]  # CLI 门禁脚本输出
"scripts/check_wiki_scoring_isolation.py" = ["T201"]  # CLI 门禁脚本输出
"tests/agent_evals/full_loop_journeys/validate_dataset.py" = ["T201"]
"tests/agent_evals/knowledge_replay/*.py" = ["T201"]  # CLI 评测报告输出
"tests/agent_evals/knowledge_retrieval/*.py" = ["T201"]  # CLI 数据集与评测报告输出
"tests/unit/test_product_routing.py" = ["N801"]  # 测试类名保留阶段 WBS 编号
"services/backend/agent/evals/gates.py" = ["N818"]  # GateViolation 为阶段2 对外契约名
"services/backend/agent/harness/fault_harness.py" = ["N818"]  # FaultInjected 为阶段4 对外契约名
"services/backend/agent/wiki/contracts.py" = ["N818"]  # WikiPageNotFound 等为对外契约异常名
"services/backend/agent/execution/errors.py" = ["N818"]  # EngineNotConfigured 等为 Cutover 计划 §30 对外契约异常名
"services/backend/agent/wiki/source_registry.py" = ["T201"]  # CLI 差异报告输出
"services/backend/agent/wiki/cli.py" = ["T201"]  # Wiki CLI 命令输出
"scripts/check_agent_cutover.py" = ["T201"]  # CLI 门禁脚本输出

[tool.ruff.lint.isort]
known-first-party = ["services", "mcp_wewe", "mcp_crawl"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ═══════════════════════════════════════════════
# Pytest
# ═══════════════════════════════════════════════
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [
    "services/mcp_wewe",
    "services/mcp_crawl",
    "services/backend",
]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (requires Docker services)",
    "slow: Slow tests (excluded from CI fast path)",
]


# ═══════════════════════════════════════════════
# Coverage
# ═══════════════════════════════════════════════
[tool.coverage.run]
source = ["services"]
omit = [
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
    # MCP server/service 入口（需真实服务运行，无法在 CI 中覆盖）
    "services/mcp_wewe/wewe_mcp_server.py",
    "services/mcp_wewe/wewe_tools/*",
    "services/mcp_wewe/http_mcp_bridge.py",
    "services/mcp_crawl/server.py",
    "services/mcp_crawl/http_bridge.py",
    "services/mcp_crawl/crawler.py",
    "services/mcp_crawl/classifier.py",
    # API 端点文件（需 MongoDB + 外部服务，CI 中无法完整覆盖）
    "services/backend/api/accounts.py",
    "services/backend/api/crawl_config.py",
    "services/backend/api/overseas_crawl.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
fail_under = 70

# ═══════════════════════════════════════════════
# Mypy (类型检查，可选开启)
# ═══════════════════════════════════════════════
[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["\\.venv/", "node_modules/", "dist/"]
